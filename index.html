<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotto 6/49 號碼走勢分析</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    :root {
      --red: #d93025;
      --red-soft: #fce8e6;
      --red-bg: #fffcfc;
      --green: #1e8e3e;
      --green-soft: #e6f4ea;
      --blue: #1f7cff;
      --blue-soft: rgba(31, 124, 255, 0.14);
      --gold: #f4c542;
      --gold-border: #c89f19;
      --text: #333;
      --muted: #666;
      --panel: #ffffff;
      --bg: #f8f8f8;
      --border: #eee;
      --shadow: 0 2px 14px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 20px;
      color: var(--text);
    }

    .container {
      max-width: 1450px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: var(--red);
      font-size: 34px;
    }

    .sub {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .msg {
      padding: 14px 16px;
      border-radius: 8px;
      background: #fff4e5;
      color: #8a5300;
      margin-bottom: 18px;
      font-weight: bold;
      text-align: center;
      line-height: 1.6;
    }

    .filter-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 14px;
      color: #666;
      font-weight: bold;
    }

    .filter-input {
      width: 120px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #f3d3cf;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      background: #fff;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: #fffcfc;
      border: 1px solid #fce8e6;
      border-radius: 12px;
      padding: 16px;
    }

    .summary-label {
      color: #8c8c8c;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-value {
      color: var(--red);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      word-break: break-word;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .number-card,
    .stat-card,
    .compare-card {
      background: #fffcfc;
      border: 1px solid #fce8e6;
      border-radius: 10px;
      padding: 15px;
    }

    .number-card h3,
    .stat-card h3,
    .compare-card h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: var(--red);
      border-bottom: 2px solid #fce8e6;
      padding-bottom: 6px;
      text-align: center;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .bar-label {
      width: 88px;
      font-weight: 500;
    }

    .bar-track {
      flex-grow: 1;
      background: #eee;
      height: 10px;
      border-radius: 5px;
      margin: 0 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 5px;
      background: var(--red);
    }

    .bar-pct {
      width: 40px;
      text-align: right;
      font-weight: bold;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .number-box {
      background: #fff;
      border: 1px solid #f3d3cf;
      border-radius: 12px;
      padding: 12px 6px;
      text-align: center;
    }

    .number-box .n {
      font-size: 22px;
      font-weight: 800;
      color: var(--red);
      line-height: 1;
      margin-bottom: 6px;
    }

    .number-box .t {
      font-size: 12px;
      color: #666;
      font-weight: 700;
      line-height: 1.3;
    }

    .empty-note {
      color: #888;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      padding: 10px 0;
    }

    .compare-input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    .compare-input {
      flex: 1;
      min-width: 260px;
      padding: 12px;
      border: 1px solid #f3d3cf;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
    }

    .compare-btn {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .compare-btn:hover {
      opacity: 0.92;
    }

    .compare-result-wrap {
      display: grid;
      gap: 10px;
    }

    .compare-summary {
      padding: 12px;
      border-radius: 10px;
      background: #fff6f5;
      border: 1px solid #f6d6d2;
      line-height: 1.6;
      font-size: 14px;
    }

    .compare-hit-card {
      padding: 12px;
      border: 1px solid #f3d3cf;
      border-radius: 10px;
      background: #fff;
      line-height: 1.7;
      font-size: 14px;
    }

    .match-balls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .match-ball {
      display: inline-flex;
      min-width: 30px;
      height: 30px;
      border-radius: 999px;
      align-items: center;
      justify-content: center;
      background: rgba(217, 48, 37, 0.14);
      color: #d93025;
      border: 1px solid #f1b8b0;
      font-weight: 700;
      font-size: 13px;
      padding: 0 8px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #eee;
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 1300px;
      border-collapse: collapse;
    }

    th {
      background: var(--red);
      color: white;
      padding: 12px 8px;
      text-align: center;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      border-bottom: 1px solid #eee;
      padding: 12px 8px;
      text-align: center;
      vertical-align: middle;
    }

    .balls {
      white-space: nowrap;
    }

    .ball {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin: 0 2px;
      font-weight: bold;
      font-size: 14px;
    }

    .main-ball {
      background: #fff;
      color: var(--red);
      border: 1px solid var(--red);
    }

    .bonus-ball {
      background: #f5f5f5;
      color: #222;
      border: 1px solid #bbb;
    }

    .gold-ball {
      background: var(--gold);
      color: #222;
      border: 1px solid var(--gold-border);
      min-width: 88px;
      width: auto;
      padding: 0 12px;
      border-radius: 18px;
      font-weight: bold;
    }

    .yes {
      display: inline-block;
      background: var(--green-soft);
      color: var(--green);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      white-space: nowrap;
    }

    .no {
      display: inline-block;
      background: var(--red-soft);
      color: var(--red);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      white-space: nowrap;
    }

    .muted {
      color: #888;
    }

    .date-cell {
      font-weight: bold;
      color: #555;
      white-space: nowrap;
    }

    .result-ball {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
    }

    .white-result-ball {
      background: #fff;
      border: 1px solid #cfcfcf;
      color: #555;
      box-shadow: inset 0 0 0 1px #f3f3f3;
    }

    .gold-result-ball {
      background: var(--gold);
      border: 1px solid var(--gold-border);
      color: #222;
    }

    .repeat-pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    .repeat-pill.red {
      background: rgba(217, 48, 37, 0.14);
      color: #d93025;
    }

    .repeat-pill.green {
      background: rgba(30, 142, 62, 0.14);
      color: #1e8e3e;
    }

    .repeat-pill.blue {
      background: rgba(31, 124, 255, 0.14);
      color: #1f7cff;
    }

    @media (max-width: 1200px) {
      .summary-grid,
      .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .feature-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      body { padding: 10px; }
      .container { padding: 14px; }
      h1 { font-size: 28px; }
      .summary-grid,
      .dashboard { grid-template-columns: 1fr; }
      .number-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .filter-bar { justify-content: flex-start; }
      .compare-input-row { flex-direction: column; align-items: stretch; }
      .compare-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lotto 6/49 號碼走勢分析</h1>
    <div class="sub">Classic 主號碼 + Bonus + Gold Ball</div>

    <div id="status" class="msg">正在連接資料庫...</div>

    <div class="filter-bar">
      <label for="drawLimitInput" class="filter-label">統計期數：</label>
      <input
        id="drawLimitInput"
        class="filter-input"
        type="number"
        min="1"
        step="1"
        placeholder="全部"
      />
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">統計期數</div>
        <div class="summary-value" id="totalDraws">-</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">最熱門主號碼</div>
        <div class="summary-value" id="topMain">-</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">最常見分區</div>
        <div class="summary-value" id="topZone">-</div>
      </div>
    </div>

    <div class="feature-grid">
      <div class="number-card">
        <h3>最熱門主號碼 Top 5</h3>
        <div class="number-grid" id="hotMainNumbers"></div>
      </div>

      <div class="number-card">
        <h3>最冷門主號碼 Top 5</h3>
        <div class="number-grid" id="coldMainNumbers"></div>
      </div>

      <div class="number-card">
        <h3>連續 15 期或以上未開號碼</h3>
        <div class="number-grid" id="missingLongGrid"></div>
      </div>
    </div>

    <div class="compare-card" style="margin-bottom:20px;">
      <h3>歷史對比查詢（輸入 6 個主號碼）</h3>
      <div class="compare-input-row">
        <input id="compareInput" class="compare-input" type="text" placeholder="例如：4,13,20,31,37,43" />
        <button id="compareBtn" class="compare-btn">開始比對</button>
      </div>
      <div id="compareResult" class="empty-note">輸入 6 個不重複主號碼，系統會幫你搵出歷史上最多相同號碼嘅期數。</div>
    </div>

    <div id="dashboard-container"></div>
    <div class="table-wrap" id="table-wrap"></div>
  </div>

  <script>
    const csvUrl = "data.csv?t=" + Date.now();

    function safe(v) {
      if (v === undefined || v === null) return "-";
      const s = String(v).trim();
      return s === "" || s.toLowerCase() === "nan" ? "-" : s;
    }

    function getFilteredRowsByLimit(rows) {
      const rawValue = document.getElementById("drawLimitInput")?.value?.trim() || "";
      if (!rawValue) return rows;

      const limit = parseInt(rawValue, 10);
      if (isNaN(limit) || limit <= 0) return rows;

      return rows.slice(0, limit);
    }

    function parseUserNumbers(input) {
      const nums = input
        .split(/[^0-9]+/)
        .map(x => parseInt(x, 10))
        .filter(x => !isNaN(x));

      const uniqueNums = [...new Set(nums)];

      if (uniqueNums.length !== 6) {
        return { error: "請輸入 6 個不重複主號碼。" };
      }

      if (uniqueNums.some(n => n < 1 || n > 49)) {
        return { error: "號碼必須介乎 1 至 49。" };
      }

      uniqueNums.sort((a, b) => a - b);
      return { numbers: uniqueNums };
    }

    function compareUserNumbers(rows, userNumbers) {
      let maxMatch = 0;
      let bestRows = [];

      rows.forEach(row => {
        const drawNums = [];
        for (let i = 1; i <= 6; i++) {
          const v = parseInt(row['n' + i], 10);
          if (!isNaN(v)) drawNums.push(v);
        }

        const matched = userNumbers.filter(n => drawNums.includes(n));

        if (matched.length > maxMatch) {
          maxMatch = matched.length;
          bestRows = [{
            date: row.date || "-",
            drawNums,
            matched,
            prize: row.gold_prize_type || "-"
          }];
        } else if (matched.length === maxMatch) {
          bestRows.push({
            date: row.date || "-",
            drawNums,
            matched,
            prize: row.gold_prize_type || "-"
          });
        }
      });

      return { maxMatch, bestRows };
    }

    function runNumberComparison(rows) {
      const input = document.getElementById("compareInput").value.trim();
      const resultBox = document.getElementById("compareResult");

      const parsed = parseUserNumbers(input);
      if (parsed.error) {
        resultBox.innerHTML = `<span style="color:#d93025; font-weight:bold;">${parsed.error}</span>`;
        return;
      }

      const result = compareUserNumbers(rows, parsed.numbers);

      if (!result.bestRows.length || result.maxMatch === 0) {
        resultBox.innerHTML = `冇搵到任何一期有相同主號碼。`;
        return;
      }

      resultBox.innerHTML = `
        <div class="compare-result-wrap">
          <div class="compare-summary">
            <div><strong>你輸入嘅主號碼：</strong>${parsed.numbers.join(", ")}</div>
            <div><strong>歷史最多相同主號碼：</strong>${result.maxMatch} 個</div>
          </div>
          ${result.bestRows.map(r => `
            <div class="compare-hit-card">
              <div><strong>期數：</strong>${r.date}</div>
              <div><strong>當期主號碼：</strong>${r.drawNums.join(", ")}</div>
              <div><strong>Gold Prize：</strong>${r.prize}</div>
              <div><strong>相同號碼：</strong></div>
              <div class="match-balls">
                ${r.matched.map(n => `<span class="match-ball">${n}</span>`).join("") || "無"}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function drawCard(title, obj, total, color) {
      const sorted = Object.entries(obj).sort((a, b) => b[1] - a[1]);
      let h = `<div class="dashboard">`;
      h += `<div class="stat-card"><h3>${title}</h3>`;

      sorted.forEach(([label, count]) => {
        const pct = total ? Math.round((count / total) * 100) : 0;

        let barColor = color;
        if (title === "連續號碼數量") {
          barColor = label.includes("0") ? "#d93025" : "#1e8e3e";
        }

        h += `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%; background:${barColor}"></div>
            </div>
            <div class="bar-pct">${pct}%</div>
          </div>
        `;
      });

      h += `</div></div>`;
      return h;
    }

    function renderGoldResultIcon(v) {
      const text = String(v || "").toLowerCase();

      if (text.includes("white ball")) {
        return `<span class="result-ball white-result-ball" title="White Ball $1 Million">⚪</span>`;
      }

      if (text.includes("gold ball jackpot won")) {
        return `<span class="result-ball gold-result-ball" title="Gold Ball Jackpot Won">🟡</span>`;
      }

      return `<span class="muted">-</span>`;
    }

    function renderNumberBoxes(containerId, items, suffix, emptyText = "") {
      const el = document.getElementById(containerId);
      if (!items.length) {
        el.innerHTML = `<div class="empty-note">${emptyText}</div>`;
        return;
      }

      el.innerHTML = items.map(item => `
        <div class="number-box">
          <div class="n">${item.num}</div>
          <div class="t">${item.value}${suffix}</div>
        </div>
      `).join("");
    }

    function calculateMissingStreaks(rows) {
      const results = [];

      for (let num = 1; num <= 49; num++) {
        let missing = 0;
        let found = false;

        for (let i = 0; i < rows.length; i++) {
          const rowNums = [];
          for (let j = 1; j <= 6; j++) {
            const v = parseInt(rows[i]['n' + j]);
            if (!isNaN(v)) rowNums.push(v);
          }

          if (rowNums.includes(num)) {
            found = true;
            break;
          }
          missing += 1;
        }

        results.push({
          num,
          value: found ? missing : rows.length
        });
      }

      return results;
    }

    function getZoneCountTuple(numbers) {
      const counts = [0, 0, 0, 0, 0];

      numbers.forEach(n => {
        const num = parseInt(n);
        if (isNaN(num)) return;

        if (num >= 1 && num <= 10) counts[0]++;
        else if (num <= 20) counts[1]++;
        else if (num <= 30) counts[2]++;
        else if (num <= 40) counts[3]++;
        else if (num <= 49) counts[4]++;
      });

      return `(${counts.join(",")})`;
    }

    function renderDashboardCards(stats, total) {
      return `
        <div class="dashboard">
          ${drawSingleCard("單雙分佈", stats.oddEven, total, "#d93025")}
          ${drawSingleCard("連續號碼數量", stats.consec, total, "#1e8e3e")}
          ${drawSingleCard("上期重複", stats.repeats, total, "#d93025")}
          ${drawSingleCard("分區數量", stats.zones, total, "#d93025")}
        </div>
      `;
    }

    function drawSingleCard(title, obj, total, color) {
      const sorted = Object.entries(obj).sort((a, b) => b[1] - a[1]);
      let h = `<div class="stat-card"><h3>${title}</h3>`;

      sorted.forEach(([label, count]) => {
        const pct = total ? Math.round((count / total) * 100) : 0;
        let barColor = color;

        if (title === "連續號碼數量") {
          barColor = label.includes("0") ? "#d93025" : "#1e8e3e";
        }

        h += `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%; background:${barColor}"></div>
            </div>
            <div class="bar-pct">${pct}%</div>
          </div>
        `;
      });

      return h + `</div>`;
    }

    fetch(csvUrl, { method: 'HEAD' })
      .then(res => {
        const lastMod = res.headers.get('Last-Modified');
        if (lastMod) {
          const d = new Date(lastMod);
          const dateStr = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          document.getElementById("status").innerHTML = `✅ <b>最後更新時間：</b>${dateStr} <br><span style="font-size:12px; font-weight:normal; color:#666;">(系統自動抓取)</span>`;
        } else {
          document.getElementById("status").innerText = "✅ 最新數據已載入";
        }
      })
      .catch(() => {
        document.getElementById("status").innerText = "✅ 最新數據已載入";
      });

    function renderAll(rows) {
      const filteredRows = getFilteredRowsByLimit(rows);

      let total = 0;
      let stats = {
        oddEven: {},
        consec: {},
        repeats: { "0個": 0, "1個": 0, "2個+": 0 },
        zones: {}
      };

      let mainFreq = {};
      for (let i = 1; i <= 49; i++) mainFreq[i] = 0;

      filteredRows.forEach(row => {
        total++;

        for (let i = 1; i <= 6; i++) {
          const v = parseInt(row['n' + i]);
          if (!isNaN(v) && mainFreq[v] !== undefined) mainFreq[v] += 1;
        }

        const oddEven = safe(row.odd_even);
        stats.oddEven[oddEven] = (stats.oddEven[oddEven] || 0) + 1;

        const consecVal = safe(row.consecutive) || "0 個連續";
        stats.consec[consecVal] = (stats.consec[consecVal] || 0) + 1;

        const r = parseInt(row.repeats, 10) || 0;
        if (r === 0) stats.repeats["0個"]++;
        else if (r === 1) stats.repeats["1個"]++;
        else stats.repeats["2個+"]++;

        if (row.zone) {
          const z = String(row.zone).charAt(0) + "個區";
          stats.zones[z] = (stats.zones[z] || 0) + 1;
        }
      });

      const hotNumbers = Object.entries(mainFreq)
        .map(([num, count]) => ({ num: Number(num), value: count }))
        .sort((a, b) => b.value - a.value || a.num - b.num)
        .slice(0, 5);

      const coldNumbers = Object.entries(mainFreq)
        .map(([num, count]) => ({ num: Number(num), value: count }))
        .sort((a, b) => a.value - b.value || a.num - b.num)
        .slice(0, 5);

      const missing15Plus = calculateMissingStreaks(filteredRows)
        .filter(item => item.value >= 15)
        .sort((a, b) => b.value - a.value || a.num - b.num);

      document.getElementById("totalDraws").textContent = total;
      document.getElementById("topMain").textContent = hotNumbers[0] ? `${hotNumbers[0].num} (${hotNumbers[0].value}次)` : "-";

      const topZone = Object.entries(stats.zones).sort((a, b) => b[1] - a[1])[0];
      document.getElementById("topZone").textContent = topZone ? topZone[0] : "-";

      renderNumberBoxes("hotMainNumbers", hotNumbers, "次");
      renderNumberBoxes("coldMainNumbers", coldNumbers, "次");
      renderNumberBoxes("missingLongGrid", missing15Plus, "期未開", "目前冇主號碼連續 15 期或以上未開");

      document.getElementById("dashboard-container").innerHTML = `
        <div class="dashboard">
          ${drawSingleCard("單雙分佈", stats.oddEven, total, "#d93025")}
          ${drawSingleCard("連續號碼數量", stats.consec, total, "#1e8e3e")}
          ${drawSingleCard("上期重複", stats.repeats, total, "#d93025")}
          ${drawSingleCard("分區數量", stats.zones, total, "#d93025")}
        </div>
      `;

      let html = `
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>主號碼</th>
              <th>Gold Ball Number</th>
              <th>Gold Prize</th>
              <th>Gold Result</th>
              <th>單雙</th>
              <th>連續數量</th>
              <th>重複</th>
              <th>分區</th>
            </tr>
          </thead>
          <tbody>
      `;

      rows.forEach(row => {
        let ballsHtml = "";
        for (let i = 1; i <= 6; i++) {
          ballsHtml += `<span class="ball main-ball">${safe(row["n" + i])}</span>`;
        }

        const goldBallHtml = safe(row.gold_ball_number) !== "-"
          ? `<span class="ball gold-ball">${safe(row.gold_ball_number)}</span>`
          : `<span class="muted">-</span>`;

        const consecStr = safe(row.consecutive);
        const consecClass = consecStr.includes("0") ? "no" : "yes";

        const repeatNum = parseInt(row.repeats, 10) || 0;
        const repeatClass = repeatNum === 0 ? "red" : (repeatNum === 1 ? "green" : "blue");

        html += `
          <tr>
            <td class="date-cell">${safe(row.date)}</td>
            <td><div class="balls">${ballsHtml}</div></td>
            <td>${goldBallHtml}</td>
            <td>${safe(row.gold_prize_type)}</td>
            <td>${renderGoldResultIcon(row.gold_result)}</td>
            <td>${safe(row.odd_even)}</td>
            <td><span class="${consecClass}">${consecStr}</span></td>
            <td><span class="repeat-pill ${repeatClass}">${repeatNum}個</span></td>
            <td>${String(safe(row.zone)).match(/^\d+個區/)?.[0] || safe(row.zone)} ${getZoneCountTuple([row.n1, row.n2, row.n3, row.n4, row.n5, row.n6])}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById('table-wrap').innerHTML = html;
    }

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const rows = (results.data || []).filter(r => r.date && r.n1);

        if (!rows.length) {
          document.getElementById("status").innerText = "讀到 data.csv，但冇有效資料。";
          document.getElementById("table-wrap").innerHTML = "";
          return;
        }

        renderAll(rows);

        document.getElementById("drawLimitInput").addEventListener("input", () => {
          renderAll(rows);
        });

        document.getElementById("compareBtn").addEventListener("click", () => {
          runNumberComparison(rows);
        });

        document.getElementById("compareInput").addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            runNumberComparison(rows);
          }
        });
      },
      error: function(err) {
        document.getElementById("status").innerText = "讀取 data.csv 失敗。";
        document.getElementById("table-wrap").innerHTML = "";
        console.error(err);
      }
    });
  </script>
</body>
</html>
