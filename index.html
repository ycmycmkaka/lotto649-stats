<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotto 6/49 號碼走勢分析</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1350px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #d93025;
      font-size: 34px;
    }

    .sub {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .msg {
      padding: 14px 16px;
      border-radius: 8px;
      background: #fff4e5;
      color: #8a5300;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #fffcfc;
      border: 1px solid #fce8e6;
      border-radius: 10px;
      padding: 15px;
    }

    .stat-card h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #d93025;
      border-bottom: 2px solid #fce8e6;
      padding-bottom: 6px;
      text-align: center;
    }

    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .bar-label {
      width: 88px;
      font-weight: 500;
    }

    .bar-track {
      flex-grow: 1;
      background: #eee;
      height: 10px;
      border-radius: 5px;
      margin: 0 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 5px;
      background: #d93025;
    }

    .bar-pct {
      width: 40px;
      text-align: right;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #eee;
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 1380px;
      border-collapse: collapse;
    }

    th {
      background: #d93025;
      color: white;
      padding: 12px 8px;
      text-align: center;
      white-space: nowrap;
      position: sticky;
      top: 0;
    }

    td {
      border-bottom: 1px solid #eee;
      padding: 12px 8px;
      text-align: center;
      vertical-align: middle;
    }

    .balls {
      white-space: nowrap;
    }

    .ball {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin: 0 2px;
      font-weight: bold;
      font-size: 14px;
    }

    .main-ball {
      background: #fff;
      color: #d93025;
      border: 1px solid #d93025;
    }

    .bonus-ball {
      background: #f5f5f5;
      color: #222;
      border: 1px solid #bbb;
    }

    .gold-ball {
      background: #f4c542;
      color: #222;
      border: 1px solid #c89f19;
      min-width: 88px;
      width: auto;
      padding: 0 12px;
      border-radius: 18px;
    }

    .yes {
      display: inline-block;
      background: #e6f4ea;
      color: #1e8e3e;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }

    .no {
      display: inline-block;
      background: #fce8e6;
      color: #d93025;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }

    .left {
      text-align: left;
      white-space: nowrap;
    }

    .muted {
      color: #888;
    }

    .date-cell {
      font-weight: bold;
      color: #555;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lotto 6/49 號碼走勢分析</h1>
    <div class="sub">Classic 主號碼 + Bonus + Gold Ball</div>

    <div id="status" class="msg">正在讀取 data.csv...</div>

    <div id="dashboard-container"></div>
    <div class="table-wrap" id="table-wrap"></div>
  </div>

  <script>
    const csvUrl = "data.csv?t=" + Date.now();

    function safe(v) {
      if (v === undefined || v === null) return "-";
      const s = String(v).trim();
      return s === "" || s.toLowerCase() === "nan" ? "-" : s;
    }

    function drawCard(title, obj, total, color) {
      const sorted = Object.entries(obj).sort((a, b) => b[1] - a[1]);
      let h = `<div class="stat-card"><h3>${title}</h3>`;

      sorted.forEach(([label, count]) => {
        const pct = total ? Math.round((count / total) * 100) : 0;
        h += `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%; background:${color}"></div>
            </div>
            <div class="bar-pct">${pct}%</div>
          </div>
        `;
      });

      return h + `</div>`;
    }

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const rows = (results.data || []).filter(r => r.date && r.n1);

        if (!rows.length) {
          document.getElementById("status").innerText = "讀到 data.csv，但冇有效資料。";
          document.getElementById("table-wrap").innerHTML = "";
          return;
        }

        document.getElementById("status").innerText = "成功讀取 data.csv。";

        let total = 0;
        let stats = {
          oddEven: {},
          consecutive: { Yes: 0, No: 0 },
          repeats: { "0個": 0, "1個": 0, "2個+": 0 },
          zones: {},
          goldPrize: {}
        };

        rows.forEach(row => {
          total++;

          const oddEven = safe(row.odd_even);
          stats.oddEven[oddEven] = (stats.oddEven[oddEven] || 0) + 1;

          const consecutive = safe(row.consecutive) === "Yes" ? "Yes" : "No";
          stats.consecutive[consecutive]++;

          const r = parseInt(row.repeats, 10) || 0;
          if (r === 0) stats.repeats["0個"]++;
          else if (r === 1) stats.repeats["1個"]++;
          else stats.repeats["2個+"]++;

          if (row.zone) {
            const z = String(row.zone).charAt(0) + "個區";
            stats.zones[z] = (stats.zones[z] || 0) + 1;
          }

          const gp = row.gold_prize_type && String(row.gold_prize_type).trim()
            ? String(row.gold_prize_type).trim()
            : "未提供";
          stats.goldPrize[gp] = (stats.goldPrize[gp] || 0) + 1;
        });

        document.getElementById("dashboard-container").innerHTML = `
          <div class="dashboard">
            ${drawCard("單雙分佈", stats.oddEven, total, "#d93025")}
            ${drawCard("連續號碼", stats.consecutive, total, "#1e8e3e")}
            ${drawCard("上期重複", stats.repeats, total, "#d93025")}
            ${drawCard("分區數量", stats.zones, total, "#d93025")}
            ${drawCard("Gold Prize", stats.goldPrize, total, "#c89f19")}
          </div>
        `;

        let html = `
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>主號碼</th>
                <th>Bonus</th>
                <th>Gold Ball Number</th>
                <th>Gold Prize</th>
                <th>Gold Result</th>
                <th>單雙</th>
                <th>連續</th>
                <th>重複</th>
                <th>分區</th>
              </tr>
            </thead>
            <tbody>
        `;

        rows.forEach(row => {
          let ballsHtml = "";
          for (let i = 1; i <= 6; i++) {
            ballsHtml += `<span class="ball main-ball">${safe(row["n" + i])}</span>`;
          }

          const bonusHtml = safe(row.bonus) !== "-"
            ? `<span class="ball bonus-ball">${safe(row.bonus)}</span>`
            : `<span class="muted">-</span>`;

          const goldBallHtml = safe(row.gold_ball_number) !== "-"
            ? `<span class="ball gold-ball">${safe(row.gold_ball_number)}</span>`
            : `<span class="muted">-</span>`;

          const consecClass = safe(row.consecutive) === "Yes" ? "yes" : "no";

          html += `
            <tr>
              <td class="date-cell">${safe(row.date)}</td>
              <td><div class="balls">${ballsHtml}</div></td>
              <td>${bonusHtml}</td>
              <td>${goldBallHtml}</td>
              <td>${safe(row.gold_prize_type)}</td>
              <td class="left">${safe(row.gold_result)}</td>
              <td>${safe(row.odd_even)}</td>
              <td><span class="${consecClass}">${safe(row.consecutive)}</span></td>
              <td>${safe(row.repeats)}個</td>
              <td>${safe(row.zone)}</td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        document.getElementById("table-wrap").innerHTML = html;
      },
      error: function(err) {
        document.getElementById("status").innerText = "讀取 data.csv 失敗。";
        document.getElementById("table-wrap").innerHTML = "";
        console.error(err);
      }
    });
  </script>
</body>
</html>
